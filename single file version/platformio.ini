; ════════════════════════════════════════════════════════════════
;  PlatformIO Project Configuration
;  Target: ESP32 WROOM-32D
; ════════════════════════════════════════════════════════════════

[env:esp32dev]
platform  = espressif32
board     = esp32dev
framework = arduino

; Serial monitor
monitor_speed = 115200

; Libraries
lib_deps =
    cyijun/ESP32MQTTClient
    bblanchon/ArduinoJson   @ ^7.0.0
