<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WiFi + MQTT Console</title>
<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-0:#05070a;
    --bg-1:#0b0f16;
    --panel:rgba(20,26,36,0.55);
    --panel-border:rgba(255,255,255,0.07);
    --pub:#33e0c8;
    --pub-dim:rgba(51,224,200,0.15);
    --sub:#b18cff;
    --sub-dim:rgba(177,140,255,0.15);
    --text-0:#e8edf3;
    --text-1:#8b96a5;
    --text-2:#525d6b;
    --danger:#ff6b6b;
    --ok:#3ee08c;
    --warn:#ffc857;
    --radius:16px;
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(circle at 15% 10%, rgba(51,224,200,0.06), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(177,140,255,0.07), transparent 40%),
      linear-gradient(180deg, var(--bg-0), var(--bg-1));
    background-attachment:fixed;
    color:var(--text-0);
    font-family:'Inter', sans-serif;
  }

  /* faint circuit-grid backdrop */
  body::before{
    content:"";
    position:fixed;
    inset:0;
    background-image:
      linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
    background-size:36px 36px;
    pointer-events:none;
    z-index:0;
  }

  /* ---------- WiFi login view ---------- */
  #wifiView{
    position:relative;
    z-index:1;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .login-panel{
    width:420px;
    max-width:calc(100vw - 40px);
    background:var(--panel);
    border:1px solid var(--panel-border);
    border-radius:var(--radius);
    padding:28px;
    backdrop-filter:blur(18px);
  }

  .login-panel h1{
    font-family:'Space Grotesk';
    margin:0 0 18px;
    font-size:22px;
    background:linear-gradient(90deg,var(--pub),var(--sub));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }

  .login-panel label{
    font-size:11px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--text-1);
  }

  .login-panel select,
  .login-panel input{
    width:100%;
    margin-top:6px;
    margin-bottom:14px;
    padding:10px 12px;
    border-radius:10px;
    border:1px solid rgba(255,255,255,0.08);
    background:rgba(255,255,255,0.03);
    color:var(--text-0);
    font-family:'JetBrains Mono';
  }

  .login-panel button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    font-weight:600;
    cursor:pointer;
    font-family:'Space Grotesk';
    background:linear-gradient(135deg,var(--pub),#1fb8a3);
    color:#041c18;
  }

  .login-status{
    margin-top:12px;
    font-size:12px;
    color:var(--text-1);
  }
  .login-status.ok{color:var(--ok);}

  /* ---------- MQTT dashboard view ---------- */
  #dashboardView{
    display:none;
    position:relative;
    z-index:1;
    padding:32px 24px 60px;
  }

  .wrap{
    max-width:1100px;
    margin:0 auto;
  }

  header{
    text-align:center;
    margin-bottom:40px;
  }
  header .eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    letter-spacing:0.18em;
    color:var(--text-2);
    text-transform:uppercase;
  }
  header h1{
    font-family:'Space Grotesk', sans-serif;
    font-size:clamp(28px, 4vw, 38px);
    font-weight:700;
    margin:6px 0 0;
    background:linear-gradient(90deg, var(--pub), var(--sub));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }

  .board{
    position:relative;
    display:grid;
    grid-template-columns:1fr 1fr;
    align-items:stretch;
    gap:24px;
  }

  @media (max-width:820px){
    .board{ grid-template-columns:1fr; }
    .relay{ display:none; }
  }

  .relay{
    position:absolute;
    top:0;
    bottom:0;
    left:50%;
    width:24px;
    transform:translateX(-50%);
    z-index:2;
    pointer-events:none;
  }

  .panel{
    background:var(--panel);
    border:1px solid var(--panel-border);
    border-radius:var(--radius);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    padding:28px;
    display:flex;
    flex-direction:column;
    gap:16px;
    box-shadow:0 20px 40px -20px rgba(0,0,0,0.6);
  }

  .panel-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:4px;
  }
  .panel-title{
    display:flex;
    align-items:center;
    gap:10px;
    font-family:'Space Grotesk', sans-serif;
    font-weight:600;
    font-size:19px;
  }
  .panel-title .arrow{ font-size:16px; opacity:0.8; }

  .pub .panel-title .arrow, .pub .dot{ color:var(--pub); }
  .sub .panel-title .arrow, .sub .dot{ color:var(--sub); }

  .status-badge{
    display:flex;
    align-items:center;
    gap:7px;
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:0.04em;
    color:var(--text-1);
    padding:5px 10px;
    border-radius:99px;
    background:rgba(255,255,255,0.04);
    border:1px solid rgba(255,255,255,0.06);
  }
  .dot{
    width:8px; height:8px;
    border-radius:50%;
    background:var(--text-2);
    box-shadow:0 0 0 0 rgba(0,0,0,0);
    transition:background 0.2s ease;
  }
  .dot.connecting{ background:var(--warn); animation:pulse 0.9s ease-in-out infinite; }
  .dot.connected{ background:var(--ok); box-shadow:0 0 10px 1px var(--ok); }
  .dot.error{ background:var(--danger); }

  @keyframes pulse{
    0%,100%{ opacity:1; transform:scale(1); }
    50%{ opacity:0.4; transform:scale(0.75); }
  }

  #dashboardView label{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--text-1);
    display:block;
    margin-bottom:6px;
  }

  .field{ display:flex; flex-direction:column; }
  .row{ display:flex; gap:12px; }
  .row .field{ flex:1; }

  #dashboardView input, #dashboardView textarea{
    width:100%;
    background:rgba(255,255,255,0.03);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:10px;
    padding:11px 13px;
    color:var(--text-0);
    font-family:'JetBrains Mono', monospace;
    font-size:13px;
    outline:none;
    transition:border-color 0.15s ease, background 0.15s ease;
  }
  #dashboardView input::placeholder, #dashboardView textarea::placeholder{ color:var(--text-2); }
  textarea{ resize:vertical; min-height:96px; line-height:1.5; }

  .pub input:focus, .pub textarea:focus{
    border-color:var(--pub);
    background:rgba(51,224,200,0.05);
  }
  .sub input:focus{
    border-color:var(--sub);
    background:rgba(177,140,255,0.05);
  }

  #dashboardView button{
    font-family:'Space Grotesk', sans-serif;
    font-weight:600;
    font-size:14px;
    border:none;
    border-radius:10px;
    padding:12px 18px;
    cursor:pointer;
    transition:transform 0.12s ease, filter 0.12s ease;
  }
  #dashboardView button:active{ transform:scale(0.97); }

  .btn-primary.pub{
    background:linear-gradient(135deg, var(--pub), #1fb8a3);
    color:#04211c;
  }
  .btn-primary.sub{
    background:linear-gradient(135deg, var(--sub), #8a63e6);
    color:#1c1233;
  }
  .btn-primary:hover{ filter:brightness(1.08); }

  .btn-ghost{
    background:rgba(255,255,255,0.04);
    color:var(--text-1);
    border:1px solid rgba(255,255,255,0.08);
  }
  .btn-ghost:hover{ background:rgba(255,255,255,0.07); color:var(--text-0); }

  .btn-row{ display:flex; gap:10px; margin-top:2px; }

  .status-msg{
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    color:var(--text-1);
    min-height:16px;
  }
  .status-msg.ok{ color:var(--ok); }
  .status-msg.err{ color:var(--danger); }

  .log{
    flex:1;
    min-height:260px;
    max-height:340px;
    overflow-y:auto;
    background:rgba(0,0,0,0.25);
    border:1px solid rgba(255,255,255,0.06);
    border-radius:10px;
    padding:14px;
    font-family:'JetBrains Mono', monospace;
    font-size:12.5px;
    line-height:1.7;
  }
  .log::-webkit-scrollbar{ width:8px; }
  .log::-webkit-scrollbar-thumb{ background:rgba(255,255,255,0.1); border-radius:8px; }
  .log-empty{ color:var(--text-2); }
  .log-line{ margin-bottom:6px; word-break:break-word; }
  .log-time{ color:var(--text-2); margin-right:8px; }
  .log-topic{ color:var(--sub); font-weight:600; }
  .log-sys{ color:var(--text-1); font-style:italic; }
  .log-err{ color:var(--danger); }

  .relay{
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .relay-line{
    width:2px;
    flex:1;
    background:linear-gradient(180deg, var(--pub), var(--sub));
    opacity:0.35;
  }
  .relay-node{
    width:14px; height:14px;
    border-radius:50%;
    background:var(--bg-1);
    border:2px solid rgba(255,255,255,0.2);
    position:relative;
    flex-shrink:0;
    margin:8px 0;
  }
  .relay-node::after{
    content:"";
    position:absolute;
    inset:-8px;
    border-radius:50%;
    border:1px solid rgba(255,255,255,0.08);
  }
  .pulse-dot{
    position:absolute;
    left:50%;
    width:8px; height:8px;
    border-radius:50%;
    transform:translateX(-50%);
    opacity:0;
    pointer-events:none;
  }
  .pulse-dot.fire{
    animation:travel 0.9s ease forwards;
  }
  @keyframes travel{
    0%{ top:0%; opacity:1; }
    90%{ opacity:1; }
    100%{ top:100%; opacity:0; }
  }

  .logout-btn{
    position:absolute;
    top:0;
    right:0;
    background:rgba(255,255,255,0.04);
    color:var(--text-1);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:10px;
    padding:8px 14px;
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:0.04em;
    cursor:pointer;
  }
  .logout-btn:hover{ background:rgba(255,255,255,0.08); color:var(--text-0); }
  header{ position:relative; }
</style>
</head>
<body>

<!-- ============ WIFI LOGIN VIEW ============ -->
<div id="wifiView">
  <div class="login-panel">
    <h1>ESP32 WiFi Config</h1>

    <label>Broker URL</label>
    <input type="text" id="wifiBroker" value="wss://test.mosquitto.org:8081/mqtt">

    <label>Config Topic</label>
    <input type="text" id="wifiTopic" value="himara/esp32-01/config/wifi">

    <label>Select WiFi</label>
    <select id="wifiList">
      <option>Himaa</option>
      <option>Dialog 4G 101</option>
      <option>Office_WiFi</option>
      <option>Factory_WiFi</option>
      <option>Lab_WiFi</option>
    </select>

    <label>Password</label>
    <input type="password" id="password" placeholder="Enter password">

    <button onclick="connectWifi()">Send to ESP32</button>

    <div class="login-status" id="wifiStatus"></div>

    <button class="logout-btn" style="margin-top:14px;position:static;width:100%;" onclick="showDashboard()">Skip to MQTT Console &rarr;</button>
  </div>
</div>

<!-- ============ MQTT DASHBOARD VIEW ============ -->
<div id="dashboardView">
  <div class="wrap">

    <header>
      <div class="eyebrow">Connected</div>
      <h1>MQTT Console</h1>
      <button class="logout-btn" onclick="logoutWifi()">Disconnect WiFi</button>
    </header>

    <div class="board">

      <!-- PUBLISHER -->
      <div class="panel pub">
        <div class="panel-head">
          <div class="panel-title"><span class="arrow">&#9655;</span> Publish</div>
          <div class="status-badge"><span class="dot" id="pubDot"></span><span id="pubDotLabel">idle</span></div>
        </div>

        <div class="field">
          <label>Broker URL</label>
          <input type="text" id="pubBroker" placeholder="wss://test.mosquitto.org:8081">
        </div>

        <div class="row">
          <div class="field">
            <label>Port <span style="opacity:.6">(optional)</span></label>
            <input type="text" id="pubPort" placeholder="8081">
          </div>
          <div class="field" style="flex:2">
            <label>Topic</label>
            <input type="text" id="pubTopic" placeholder="site/device01/telemetry">
          </div>
        </div>

        <div class="field">
          <label>Message</label>
          <textarea id="pubMessage" placeholder='{ "temp": 24.5 }'></textarea>
        </div>

        <div class="btn-row">
          <button class="btn-primary pub" onclick="publishMessage()">Publish message</button>
        </div>
        <div class="status-msg" id="pubStatus"></div>
      </div>

      <!-- RELAY -->
      <div class="relay">
        <div class="relay-line" style="position:relative">
          <div class="pulse-dot" id="pulseDot" style="background:var(--pub); box-shadow:0 0 8px 2px var(--pub);"></div>
        </div>
        <div class="relay-node"></div>
        <div class="relay-line"></div>
      </div>

      <!-- SUBSCRIBER -->
      <div class="panel sub">
        <div class="panel-head">
          <div class="panel-title">Subscribe <span class="arrow">&#9655;</span></div>
          <div class="status-badge"><span class="dot" id="subDot"></span><span id="subDotLabel">idle</span></div>
        </div>

        <div class="field">
          <label>Broker URL</label>
          <input type="text" id="subBroker" placeholder="wss://test.mosquitto.org:8081">
        </div>

        <div class="field">
          <label>Topic</label>
          <input type="text" id="subTopic" placeholder="site/+/telemetry">
        </div>

        <div class="btn-row">
          <button class="btn-primary sub" onclick="startSubscribe()">Subscribe</button>
          <button class="btn-ghost" onclick="stopSubscribe()">Disconnect</button>
        </div>

        <label style="margin-top:6px;">Received messages</label>
        <div class="log" id="messages">
          <div class="log-empty">No messages yet — subscribe to a topic to see live traffic here.</div>
        </div>
      </div>

    </div>
  </div>
</div>

<script>
// ============ VIEW SWITCHING ============
function showDashboard(){
  document.getElementById("wifiView").style.display = "none";
  document.getElementById("dashboardView").style.display = "block";
}
function showWifiLogin(){
  document.getElementById("dashboardView").style.display = "none";
  document.getElementById("wifiView").style.display = "flex";
}

// ============ WIFI CONFIG (published to ESP32 over MQTT) ============
function connectWifi(){
  const ssid = document.getElementById("wifiList").value;
  const pass = document.getElementById("password").value;
  const brokerRaw = document.getElementById("wifiBroker").value.trim();
  const topic = document.getElementById("wifiTopic").value.trim();
  const status = document.getElementById("wifiStatus");

  if(!pass){
    status.textContent = "Enter password first.";
    status.className = "login-status";
    return;
  }
  if(!brokerRaw || !topic){
    status.textContent = "Enter broker URL and topic first.";
    status.className = "login-status";
    return;
  }

  status.textContent = "Publishing credentials for " + ssid + "...";
  status.className = "login-status";

  const brokerUrl = normalizeBroker(brokerRaw);
  const client = mqtt.connect(brokerUrl);

  client.on('connect', function () {
    const payload = JSON.stringify({ ssid: ssid, password: pass });
    client.publish(topic, payload);
    status.className = "login-status ok";
    status.textContent = "Sent to ESP32. Watch its Serial monitor — it will reboot onto the new network if the SSID is on its allow-list.";
    client.end();
  });

  client.on('error', function (err) {
    status.className = "login-status";
    status.textContent = "Publish error: " + err.message;
    client.end();
  });
}

function logoutWifi(){
  stopSubscribe();
  showWifiLogin();
}

// ============ MQTT DASHBOARD ============
function normalizeBroker(url, portOverride) {
  let hasProtocol = url.startsWith("ws://") || url.startsWith("wss://");
  if (!hasProtocol) {
    url = "wss://" + url;
  }

  const protoEnd = url.indexOf("://") + 3;
  const rest = url.slice(protoEnd); // e.g. "test.mosquitto.org/mqtt" or "test.mosquitto.org:8081/mqtt"
  const pathStart = rest.indexOf("/");
  let hostPort = pathStart === -1 ? rest : rest.slice(0, pathStart);
  let path = pathStart === -1 ? "" : rest.slice(pathStart);

  // add a port if one wasn't already in the host, defaulting to 8081
  // (Mosquitto's public WebSocket listener; wss:// alone would default to 443, which is wrong here)
  if (!hostPort.includes(":")) {
    hostPort += ":" + (portOverride || "8081");
  } else if (portOverride) {
    hostPort = hostPort.split(":")[0] + ":" + portOverride;
  }

  if (!path.includes("/mqtt")) {
    path = "/mqtt";
  }

  return url.slice(0, protoEnd) + hostPort + path;
}

function timeNow(){
  const d = new Date();
  return d.toTimeString().slice(0,8);
}

function setDot(prefix, state, label){
  const dot = document.getElementById(prefix + "Dot");
  const lbl = document.getElementById(prefix + "DotLabel");
  dot.className = "dot" + (state ? " " + state : "");
  lbl.textContent = label;
}

function firePulse(){
  const p = document.getElementById("pulseDot");
  p.classList.remove("fire");
  void p.offsetWidth; // restart animation
  p.classList.add("fire");
}

// ---------- Publisher ----------
function publishMessage() {
    const brokerRaw = document.getElementById("pubBroker").value.trim();
    const port = document.getElementById("pubPort").value.trim();
    const topic = document.getElementById("pubTopic").value.trim();
    const message = document.getElementById("pubMessage").value;
    const statusEl = document.getElementById("pubStatus");

    if (!brokerRaw || !topic) {
        statusEl.textContent = "Enter broker URL and topic first.";
        statusEl.className = "status-msg err";
        return;
    }

    let brokerUrl = normalizeBroker(brokerRaw, port);

    setDot("pub", "connecting", "connecting…");
    statusEl.textContent = "Connecting…";
    statusEl.className = "status-msg";

    const client = mqtt.connect(brokerUrl);

    client.on('connect', function () {
        client.publish(topic, message);
        setDot("pub", "connected", "sent");
        statusEl.textContent = "Message published to " + topic;
        statusEl.className = "status-msg ok";
        firePulse();
        client.end();
        setTimeout(() => setDot("pub", "", "idle"), 2000);
    });

    client.on('error', function (err) {
        setDot("pub", "error", "error");
        statusEl.textContent = "Publish error: " + err.message;
        statusEl.className = "status-msg err";
        client.end();
    });
}

// ---------- Subscriber ----------
let subClient;

function appendLog(html){
  const box = document.getElementById("messages");
  const empty = box.querySelector(".log-empty");
  if (empty) empty.remove();
  box.insertAdjacentHTML("beforeend", html);
  box.scrollTop = box.scrollHeight;
}

function startSubscribe() {
    const brokerRaw = document.getElementById("subBroker").value.trim();
    const topic = document.getElementById("subTopic").value.trim();

    if (!brokerRaw || !topic) {
        appendLog('<div class="log-line log-err">[' + timeNow() + '] Enter broker URL and topic first.</div>');
        return;
    }

    if (subClient) subClient.end(true);

    const brokerUrl = normalizeBroker(brokerRaw);

    setDot("sub", "connecting", "connecting…");
    subClient = mqtt.connect(brokerUrl);

    subClient.on('connect', function () {
        subClient.subscribe(topic);
        setDot("sub", "connected", "connected");
        appendLog('<div class="log-line log-sys">[' + timeNow() + '] Subscribed to <span class="log-topic">' + topic + '</span></div>');
    });

    subClient.on('message', function (topic, message) {
        firePulse();
        appendLog(
          '<div class="log-line"><span class="log-time">[' + timeNow() + ']</span>' +
          '<span class="log-topic">' + topic + '</span> — ' + message.toString() + '</div>'
        );
    });

    subClient.on('error', function (err) {
        setDot("sub", "error", "error");
        appendLog('<div class="log-line log-err">[' + timeNow() + '] Error: ' + err.message + '</div>');
    });
}

function stopSubscribe() {
    if (subClient) {
        subClient.end(true);
        setDot("sub", "", "idle");
        appendLog('<div class="log-line log-sys">[' + timeNow() + '] Disconnected.</div>');
        subClient = null;
    }
}
</script>

</body>
</html>
