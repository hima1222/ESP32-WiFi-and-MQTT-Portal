; PlatformIO Project Configuration File
;
; Board: change to match your hardware (esp32dev / esp32-s3-devkitc-1 / esp32-c3-devkitm-1 ...)
[env:esp32dev]
platform   = espressif32
board      = esp32dev
framework  = arduino

monitor_speed = 115200
upload_speed  = 921600

; ESP32MQTTClient wraps ESP-IDF's native esp-mqtt component, which is the only
; commonly-available client that implements *real* QoS 0/1/2 (PUBREC/PUBREL/PUBCOMP).
; PubSubClient and most "simple" Arduino MQTT libraries only fake QoS 2 or skip it entirely.
lib_deps =
    cyijun/ESP32MQTTClient @ ^1.1.3
    bblanchon/ArduinoJson @ ^7.0.0

build_flags =
    -DCORE_DEBUG_LEVEL=2
